<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ひっ算プリントメーカー</title>
    <style>
        :root {
            --primary-color: #bae6fd; /* 優しい明るいブルー */
            --primary-hover: #7dd3fc;
            --btn-text: #0369a1;      /* 統一感のある文字色 */
            --bg-color: #f0fdfa;      /* 清潔感のある淡いミント色 */
            --panel-bg: #ffffff;
            --text-color: #334155;
            --border-color: #cbd5e1;
            --print-font-size: 16pt;  /* プリント本文の初期サイズを16ptに変更 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, button, input, select, textarea {
            /* 装飾感のないUDゴシック系のフォントファミリーを最優先に指定 */
            font-family: 'BIZ UDPGothic', 'BIZ UPGothic', 'Yu Gothic', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .settings-panel {
            background-color: var(--panel-bg);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: 24px;
            margin-bottom: 24px;
            width: 100%;
            max-width: 900px;
            border-top: 8px solid var(--primary-color);
        }

        .settings-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #0369a1;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .settings-group {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 14px;
        }

        .group-title {
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 10px;
            color: #0f172a;
            border-left: 4px solid var(--primary-color);
            padding-left: 8px;
        }

        .number-input-wrapper {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 8px;
        }

        .number-input-wrapper label {
            font-size: 0.85rem;
            width: 80px;
        }

        .custom-spinner {
            display: flex;
            align-items: center;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: #fff;
            overflow: hidden;
            height: 32px;
        }

        .custom-spinner input[type="number"] {
            width: 60px;
            border: none;
            text-align: center;
            font-size: 0.95rem;
            outline: none;
            -moz-appearance: textfield;
        }

        .custom-spinner input[type="number"]::-webkit-outer-spin-button,
        .custom-spinner input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .spinner-btns {
            display: flex;
            flex-direction: column;
            border-left: 1px solid var(--border-color);
            height: 100%;
        }

        .spinner-btn {
            background: #f1f5f9;
            border: none;
            cursor: pointer;
            width: 24px;
            height: 16px;
            font-size: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            color: #64748b;
        }

        .spinner-btn:hover {
            background: #e2e8f0;
            color: #334155;
        }

        .spinner-btn:first-child {
            border-bottom: 1px solid var(--border-color);
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            margin-bottom: 8px;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .sub-options {
            margin-left: 24px;
            margin-top: 4px;
            border-left: 2px solid #e2e8f0;
            padding-left: 10px;
        }

        .action-buttons {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #e2e8f0;
        }

        /* 4つのボタンの高さを42pxに完全固定、フォント指定も統一 */
        .btn {
            flex: 1;
            min-width: 160px;
            height: 42px;
            padding: 0 16px;
            font-size: 0.95rem;
            font-weight: bold;
            font-family: inherit;
            border: 1px solid var(--primary-hover);
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: var(--primary-color);
            color: var(--btn-text);
            transition: all 0.2s ease;
            text-align: center;
            box-sizing: border-box;
            line-height: 1;
        }

        .btn:hover {
            background-color: var(--primary-hover);
            border-color: #0ea5e9;
        }

        .file-input-label {
            position: relative;
            overflow: hidden;
        }

        .file-input-label input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        .print-container {
            width: 100%;
            display: flex;
            justify-content: center;
            overflow-x: auto;
            padding-bottom: 40px;
        }

        .print-page {
            background-color: #ffffff;
            width: 210mm;
            min-height: 297mm;
            padding: 15mm 20mm; /* 左右対称のきれいな余白 */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            color: #000000; /* 本文は完全にグレースケール */
            font-size: var(--print-font-size);
            position: relative;
        }

        /* 編集可能であることを明示するホバーエフェクト */
        .editable:hover {
            outline: 2px dashed #93c5fd;
            background-color: #f8fafc;
            cursor: pointer;
        }

        /* 名前欄：14pt固定 */
        .print-header {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
            font-size: 14pt !important;
            border: none;
        }

        .name-area {
            display: inline-block;
            min-width: 220px;
            border-bottom: 1px solid #000;
            padding-bottom: 2px;
            text-align: left;
        }

        /* 指示文「計算をしよう」：14pt固定 */
        .print-instruction {
            font-size: 14pt !important;
            font-weight: bold;
            margin-bottom: 15px;
            padding: 4px;
            border-radius: 4px;
        }

        /* 問題の配置グリッド（左右対称） */
        .problems-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* デフォルトの9問に合わせて3列構成 */
            gap: 25px 20px;
            flex-grow: 1;
            justify-items: center; /* 各列の中で水平中央に配置 */
        }

        .problem-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            page-break-inside: avoid;
            padding: 8px;
            border-radius: 4px;
            width: 100%;
        }

        .calc-wrapper {
            display: flex;
            justify-content: center;
            margin-top: 10px;
            width: 100%;
        }

        /* ひっ算部分。親要素のフォントサイズ変更に美しく追従するようにem単位に調整しています */
        .calc-grid {
            display: grid;
            grid-template-columns: repeat(5, 1.25em); /* 最大3桁を収める5列構成（一番左は空欄、左から2番目が符号） */
            grid-template-rows: repeat(3, 1.6em);
            font-family: inherit; /* 設定画面と同じ視認性の高いUDゴシック系フォントを継承させます */
            font-size: 1.35em; /* 基準のフォントサイズに対して少し大きめに表示 */
            text-align: center;
            line-height: 1.6em;
            position: relative; /* 問題番号を絶対配置するための基準 */
            margin-top: 2.2em;   /* 問題番号が上に乗るための十分なスペースを確保 */
        }

        /* 問題番号を「＋」の真上にぴったり配置 */
        .problem-title {
            position: absolute;
            top: -1.8em; /* いちぎょうめの上に浮かせます */
            left: 1.25em; /* col1（左から2番目の、＋符号が表示される列）の左端に合わせます */
            width: 1.25em; /* 1の位や10の位と同等の1マス幅に合わせます */
            text-align: center; /* 左右中央揃えにすることで符号の真上に完璧に揃います */
            font-size: 0.75em; /* 親のfont-sizeに対する比率で適正サイズに */
            font-weight: bold;
            white-space: nowrap;
            font-family: inherit; /* UDゴシックのフォントを適用 */
        }

        .calc-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            user-select: all;
        }

        /* にぎょうめの下に太いひっ算のよこせん（横線）を引く */
        /* 千の位(col1)から一の位(col4)までの範囲に線を引き、一番左の列(col0)には引きません */
        .calc-cell-row1.calc-cell-col1,
        .calc-cell-row1.calc-cell-col2,
        .calc-cell-row1.calc-cell-col3,
        .calc-cell-row1.calc-cell-col4 {
            border-bottom: 2.1px solid #000000;
        }

        /* 指定された3本の補助線（1の位の右、1の位と十の位の間、十の位の左） */
        .has-helper .calc-cell-col4 {
            border-right: 1px dashed #a3a3a3; /* 1の位の右 */
            border-left: 1px dashed #a3a3a3;  /* 1の位と十の位の間 */
        }
        .has-helper .calc-cell-col3 {
            border-left: 1px dashed #a3a3a3;  /* 十の位の左 */
        }

        /* 答えのセル */
        .calc-cell-answer {
            font-weight: bold;
        }

        /* 答えを非表示にするクラス */
        .hide-answers .calc-cell-answer {
            color: transparent !important;
        }

        @media print {
            @page {
                size: A4 portrait;
                margin: 0; /* 余白をゼロにしてはみ出しを防ぎます */
            }

            body {
                background-color: #ffffff;
                padding: 0;
                margin: 0;
            }

            .settings-panel, .no-print {
                display: none !important;
            }

            .print-container {
                padding: 0;
                overflow: visible;
            }

            .print-page {
                width: 210mm;
                height: 297mm; /* A4サイズに完全固定 */
                box-sizing: border-box;
                box-shadow: none;
                padding: 15mm 20mm;
                margin: 0;
                overflow: hidden; /* 2ページ目の発生を防ぎます */
                page-break-inside: avoid;
                page-break-after: avoid;
            }

            .editable:hover {
                outline: none;
                background-color: transparent;
            }
        }
    </style>
</head>
<body>

    <div class="settings-panel">
        <div class="settings-title">
            ひっ算プリント設定パネル
        </div>
        
        <div class="settings-grid">
            <!-- 計算タイプの設定 -->
            <div class="settings-group">
                <div class="group-title">1. 計算の種類</div>
                <label class="checkbox-label">
                    <input type="checkbox" id="calc-add" checked onchange="toggleAddOptions()"> たし算
                </label>
                <div id="add-options" class="sub-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="add-no-carry"> くり上がりなし
                    </label>
                </div>

                <label class="checkbox-label" style="margin-top: 10px;">
                    <input type="checkbox" id="calc-sub" checked onchange="toggleSubOptions()"> ひき算
                </label>
                <div id="sub-options" class="sub-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="sub-no-borrow"> くり下がりなし
                    </label>
                </div>
            </div>

            <!-- 数値の範囲設定 -->
            <div class="settings-group">
                <div class="group-title">2. 数字の範囲</div>
                <p style="font-size: 0.8rem; color: #64748b; margin-bottom: 8px;">上の段</p>
                <div class="number-input-wrapper">
                    <label>最小値:</label>
                    <div class="custom-spinner">
                        <input type="number" id="upper-min" value="10" min="1" max="999" onchange="validateRange(this)">
                        <div class="spinner-btns">
                            <button type="button" class="spinner-btn" 
                                    onmousedown="startSpinning('upper-min', 'up')" 
                                    onmouseup="stopSpinning()" 
                                    onmouseleave="stopSpinning()"
                                    ontouchstart="startSpinning('upper-min', 'up')"
                                    ontouchend="stopSpinning()">▲</button>
                            <button type="button" class="spinner-btn" 
                                    onmousedown="startSpinning('upper-min', 'down')" 
                                    onmouseup="stopSpinning()" 
                                    onmouseleave="stopSpinning()"
                                    ontouchstart="startSpinning('upper-min', 'down')"
                                    ontouchend="stopSpinning()">▼</button>
                        </div>
                    </div>
                </div>
                <div class="number-input-wrapper">
                    <label>最大値:</label>
                    <div class="custom-spinner">
                        <input type="number" id="upper-max" value="99" min="1" max="999" onchange="validateRange(this)">
                        <div class="spinner-btns">
                            <button type="button" class="spinner-btn" 
                                    onmousedown="startSpinning('upper-max', 'up')" 
                                    onmouseup="stopSpinning()" 
                                    onmouseleave="stopSpinning()"
                                    ontouchstart="startSpinning('upper-max', 'up')"
                                    ontouchend="stopSpinning()">▲</button>
                            <button type="button" class="spinner-btn" 
                                    onmousedown="startSpinning('upper-max', 'down')" 
                                    onmouseup="stopSpinning()" 
                                    onmouseleave="stopSpinning()"
                                    ontouchstart="startSpinning('upper-max', 'down')"
                                    ontouchend="stopSpinning()">▼</button>
                        </div>
                    </div>
                </div>

                <p style="font-size: 0.8rem; color: #64748b; margin-top: 12px; margin-bottom: 8px;">下の段</p>
                <div class="number-input-wrapper">
                    <label>最小値:</label>
                    <div class="custom-spinner">
                        <input type="number" id="lower-min" value="10" min="1" max="999" onchange="validateRange(this)">
                        <div class="spinner-btns">
                            <button type="button" class="spinner-btn" 
                                    onmousedown="startSpinning('lower-min', 'up')" 
                                    onmouseup="stopSpinning()" 
                                    onmouseleave="stopSpinning()"
                                    ontouchstart="startSpinning('lower-min', 'up')"
                                    ontouchend="stopSpinning()">▲</button>
                            <button type="button" class="spinner-btn" 
                                    onmousedown="startSpinning('lower-min', 'down')" 
                                    onmouseup="stopSpinning()" 
                                    onmouseleave="stopSpinning()"
                                    ontouchstart="startSpinning('lower-min', 'down')"
                                    ontouchend="stopSpinning()">▼</button>
                        </div>
                    </div>
                </div>
                <div class="number-input-wrapper">
                    <label>最大値:</label>
                    <div class="custom-spinner">
                        <input type="number" id="lower-max" value="99" min="1" max="999" onchange="validateRange(this)">
                        <div class="spinner-btns">
                            <button type="button" class="spinner-btn" 
                                    onmousedown="startSpinning('lower-max', 'up')" 
                                    onmouseup="stopSpinning()" 
                                    onmouseleave="stopSpinning()"
                                    ontouchstart="startSpinning('lower-max', 'up')"
                                    ontouchend="stopSpinning()">▲</button>
                            <button type="button" class="spinner-btn" 
                                    onmousedown="startSpinning('lower-max', 'down')" 
                                    onmouseup="stopSpinning()" 
                                    onmouseleave="stopSpinning()"
                                    ontouchstart="startSpinning('lower-max', 'down')"
                                    ontouchend="stopSpinning()">▼</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- プリントのレイアウト -->
            <div class="settings-group">
                <div class="group-title">3. プリントのレイアウト</div>
                
                <div class="number-input-wrapper">
                    <label>問題数:</label>
                    <div class="custom-spinner">
                        <input type="number" id="problem-count" value="9" min="4" max="24" onchange="adjustGridColumns()">
                        <div class="spinner-btns">
                            <button type="button" class="spinner-btn" 
                                    onmousedown="startSpinning('problem-count', 'up')" 
                                    onmouseup="stopSpinning()" 
                                    onmouseleave="stopSpinning()"
                                    ontouchstart="startSpinning('problem-count', 'up')"
                                    ontouchend="stopSpinning()">▲</button>
                            <button type="button" class="spinner-btn" 
                                    onmousedown="startSpinning('problem-count', 'down')" 
                                    onmouseup="stopSpinning()" 
                                    onmouseleave="stopSpinning()"
                                    ontouchstart="startSpinning('problem-count', 'down')"
                                    ontouchend="stopSpinning()">▼</button>
                        </div>
                    </div>
                </div>

                <div class="number-input-wrapper" style="margin-top: 10px;">
                    <label>文字サイズ:</label>
                    <div class="custom-spinner">
                        <input type="number" id="font-size-pt" value="16" min="8" max="24" onchange="updateFontSize()">
                        <div class="spinner-btns">
                            <button type="button" class="spinner-btn" 
                                    onmousedown="startSpinning('font-size-pt', 'up')" 
                                    onmouseup="stopSpinning()" 
                                    onmouseleave="stopSpinning()"
                                    ontouchstart="startSpinning('font-size-pt', 'up')"
                                    ontouchend="stopSpinning()">▲</button>
                            <button type="button" class="spinner-btn" 
                                    onmousedown="startSpinning('font-size-pt', 'down')" 
                                    onmouseup="stopSpinning()" 
                                    onmouseleave="stopSpinning()"
                                    ontouchstart="startSpinning('font-size-pt', 'down')"
                                    ontouchend="stopSpinning()">▼</button>
                        </div>
                    </div>
                    <span style="font-size: 0.8rem; color: #64748b; margin-left: 4px;">pt</span>
                </div>

                <div style="margin-top: 14px;">
                    <label class="checkbox-label">
                        <input type="checkbox" id="show-helper" checked onchange="toggleHelperLines()"> 位の補助縦線を出す
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="show-answers" checked onchange="toggleAnswerVisibility()"> 答えを表示する
                    </label>
                </div>
            </div>
        </div>

        <!-- 4つの操作ボタンを一列に配置、サイズ・フォントを同一に -->
        <div class="action-buttons">
            <button class="btn" onclick="generateProblems()">新しい問題</button>
            <button class="btn" onclick="window.print()">印刷する</button>
            <button class="btn" onclick="saveHTML()">HTMLを保存する</button>
            <label class="btn file-input-label">
                HTMLを読み込む
                <input type="file" id="file-loader" accept=".html" onchange="loadHTML(event)">
            </label>
        </div>
    </div>

    <div class="print-container">
        <div class="print-page" id="print-area">
            <!-- 名前欄 -->
            <div class="print-header">
                <div class="editable" contenteditable="true" style="outline: none;">
                    名前：<span class="name-area">&nbsp;</span>
                </div>
            </div>

            <!-- 共通指示文 -->
            <div class="print-instruction editable" contenteditable="true" style="outline: none;">
                計算をしよう
            </div>

            <!-- 問題表示グリッド -->
            <div class="problems-grid" id="problems-grid">
                <!-- JavaScriptでここに自動生成された問題が並びます -->
            </div>
        </div>
    </div>

    <!-- 簡易メッセージ通知領域 -->
    <div id="toast-message" style="display: none; position: fixed; bottom: 20px; background: rgba(0,0,0,0.8); color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 0.9rem; z-index: 9999;"></div>

    <script>
        let spinInterval = null;
        let spinTimeout = null;

        function startSpinning(id, direction) {
            const input = document.getElementById(id);
            if (!input) return;

            // 最初の一回を実行
            changeValue(input, direction);

            // 400ms長押ししたら連続でダーっとカウント開始します
            spinTimeout = setTimeout(() => {
                spinInterval = setInterval(() => {
                    changeValue(input, direction);
                }, 60); // 1秒間に約16回変更される速度
            }, 400);
        }

        function stopSpinning() {
            if (spinTimeout) clearTimeout(spinTimeout);
            if (spinInterval) clearInterval(spinInterval);
            spinTimeout = null;
            spinInterval = null;
        }

        function changeValue(input, direction) {
            const min = parseInt(input.getAttribute('min')) || 1;
            const max = parseInt(input.getAttribute('max')) || 999;
            let val = parseInt(input.value) || 0;

            if (direction === 'up') {
                if (val < max) input.value = val + 1;
            } else if (direction === 'down') {
                if (val > min) input.value = val - 1;
            }
            input.dispatchEvent(new Event('change'));
        }

        // 範囲外の数値を防ぎ、最小値と最大値を賢く連動させるバリデーション
        function validateRange(inputElement) {
            const id = inputElement.id;
            const isMin = id.endsWith('-min');
            const prefix = id.split('-')[0]; // 'upper' または 'lower'
            
            const minInput = document.getElementById(prefix + '-min');
            const maxInput = document.getElementById(prefix + '-max');
            
            let minVal = parseInt(minInput.value) || 1;
            let maxVal = parseInt(maxInput.value) || 1;

            if (minVal > maxVal) {
                if (isMin) {
                    // 最小値を上げて最大値を超えたとき、最大値も連動して引き上げます
                    maxInput.value = minVal;
                } else {
                    // 最大値を下げて最小値を下回ったとき、最小値も連動して引き下げます
                    minInput.value = maxVal;
                }
            }
        }

        function toggleAddOptions() {
            const addChecked = document.getElementById('calc-add').checked;
            document.getElementById('add-no-carry').disabled = !addChecked;
        }

        function toggleSubOptions() {
            const subChecked = document.getElementById('calc-sub').checked;
            document.getElementById('sub-no-borrow').disabled = !subChecked;
        }

        function updateFontSize() {
            const size = document.getElementById('font-size-pt').value;
            document.getElementById('print-area').style.setProperty('--print-font-size', size + 'pt');
        }

        function toggleHelperLines() {
            const showHelper = document.getElementById('show-helper').checked;
            const grids = document.querySelectorAll('.calc-grid');
            grids.forEach(grid => {
                if (showHelper) {
                    grid.classList.add('has-helper');
                } else {
                    grid.classList.remove('has-helper');
                }
            });
        }

        function toggleAnswerVisibility() {
            const showAnswers = document.getElementById('show-answers').checked;
            const printPage = document.getElementById('print-area');
            if (showAnswers) {
                printPage.classList.remove('hide-answers');
            } else {
                printPage.classList.add('hide-answers');
            }
        }

        function adjustGridColumns() {
            const count = parseInt(document.getElementById('problem-count').value) || 9;
            const grid = document.getElementById('problems-grid');
            
            if (count <= 8) {
                grid.style.gridTemplateColumns = 'repeat(2, 1fr)';
                grid.style.gap = '40px 30px';
            } else if (count <= 12) {
                grid.style.gridTemplateColumns = 'repeat(3, 1fr)';
                grid.style.gap = '30px 20px';
            } else {
                grid.style.gridTemplateColumns = 'repeat(4, 1fr)';
                grid.style.gap = '25px 15px';
            }
        }

        function checkNoCarry(num1, num2) {
            let str1 = String(num1).split('').reverse();
            let str2 = String(num2).split('').reverse();
            let len = Math.max(str1.length, str2.length);
            for (let i = 0; i < len; i++) {
                let d1 = parseInt(str1[i] || 0);
                let d2 = parseInt(str2[i] || 0);
                if (d1 + d2 >= 10) return false;
            }
            return true;
        }

        function checkNoBorrow(num1, num2) {
            if (num1 < num2) return false;
            let str1 = String(num1).split('').reverse();
            let str2 = String(num2).split('').reverse();
            let len = Math.max(str1.length, str2.length);
            for (let i = 0; i < len; i++) {
                let d1 = parseInt(str1[i] || 0);
                let d2 = parseInt(str2[i] || 0);
                if (d1 < d2) return false;
            }
            return true;
        }

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // 読み込み完了時や編集時の設定同期処理
        function syncLoadedInputs() {
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                if (input.type === 'checkbox') {
                    input.checked = input.hasAttribute('checked');
                } else if (input.type === 'number') {
                    const attrVal = input.getAttribute('value');
                    if (attrVal !== null) {
                        input.value = attrVal;
                    }
                }
            });
            updateFontSize();
            toggleAnswerVisibility();
            toggleAddOptions();
            toggleSubOptions();
        }

        function showToast(message) {
            const toast = document.getElementById('toast-message');
            toast.innerText = message;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }

        function generateProblems() {
            const useAdd = document.getElementById('calc-add').checked;
            const useSub = document.getElementById('calc-sub').checked;

            const addNoCarry = document.getElementById('add-no-carry').checked;
            const subNoBorrow = document.getElementById('sub-no-borrow').checked;

            const uMin = parseInt(document.getElementById('upper-min').value) || 10;
            const uMax = parseInt(document.getElementById('upper-max').value) || 99;
            const lMin = parseInt(document.getElementById('lower-min').value) || 10;
            const lMax = parseInt(document.getElementById('lower-max').value) || 99;

            const count = parseInt(document.getElementById('problem-count').value) || 9;

            const types = [];
            if (useAdd) types.push('add');
            if (useSub) types.push('sub');

            if (types.length === 0) {
                showToast('たし算、ひき算のいずれか1つ以上を選んでくださいね。');
                return;
            }

            const grid = document.getElementById('problems-grid');
            grid.innerHTML = '';
            adjustGridColumns();

            const showHelper = document.getElementById('show-helper').checked;

            for (let pNum = 1; pNum <= count; pNum++) {
                const type = types[Math.floor(Math.random() * types.length)];
                let num1 = 0;
                let num2 = 0;
                let ans = 0;
                let sign = '';
                let success = false;
                let attempts = 0;

                while (!success && attempts < 1000) {
                    attempts++;
                    num1 = getRandomInt(uMin, uMax);
                    num2 = getRandomInt(lMin, lMax);

                    if (type === 'add') {
                        sign = '＋';
                        ans = num1 + num2;
                        if (addNoCarry) {
                            if (checkNoCarry(num1, num2)) success = true;
                        } else {
                            success = true;
                        }
                    } else if (type === 'sub') {
                        sign = '－';
                        ans = num1 - num2;
                        if (num1 >= num2) {
                            if (subNoBorrow) {
                                if (checkNoBorrow(num1, num2)) success = true;
                            } else {
                                success = true;
                            }
                        }
                    }
                }

                if (!success) {
                    if (type === 'sub' && num1 < num2) {
                        let temp = num1;
                        num1 = num2;
                        num2 = temp;
                        ans = num1 - num2;
                    }
                }

                const str1 = String(num1).split('');
                const str2 = String(num2).split('');
                const strAns = String(ans).split('');

                const probItem = document.createElement('div');
                probItem.className = 'problem-item';

                const calcWrapper = document.createElement('div');
                calcWrapper.className = 'calc-wrapper';

                const calcGrid = document.createElement('div');
                calcGrid.className = 'calc-grid' + (showHelper ? ' has-helper' : '');

                // 問題番号を「＋」の上にぴったり配置
                const probTitle = document.createElement('div');
                probTitle.className = 'problem-title editable';
                probTitle.contentEditable = 'true';
                probTitle.innerHTML = `(${pNum})`;
                calcGrid.appendChild(probTitle);

                // いちぎょうめ: 上の段
                for (let i = 0; i < 5; i++) {
                    const cell = document.createElement('div');
                    cell.className = `calc-cell calc-cell-row0 calc-cell-col${i} editable`;
                    cell.contentEditable = 'true';
                    const digitIndex = str1.length - (5 - i);
                    if (digitIndex >= 0) {
                        cell.innerText = str1[digitIndex];
                    } else {
                        cell.innerHTML = '&nbsp;';
                    }
                    calcGrid.appendChild(cell);
                }

                // にぎょうめ: 下の段
                for (let i = 0; i < 5; i++) {
                    const cell = document.createElement('div');
                    cell.className = `calc-cell calc-cell-row1 calc-cell-col${i} editable`;
                    cell.contentEditable = 'true';
                    
                    if (i === 1) {
                        cell.innerText = sign; // 千の位に符号を表示します
                    } else if (i === 0) {
                        cell.innerHTML = '&nbsp;'; // 万の位は空欄
                    } else {
                        const digitIndex = str2.length - (5 - i);
                        if (digitIndex >= 0) {
                            cell.innerText = str2[digitIndex];
                        } else {
                            cell.innerHTML = '&nbsp;';
                        }
                    }
                    calcGrid.appendChild(cell);
                }

                // さんぎょうめ: 答え
                for (let i = 0; i < 5; i++) {
                    const cell = document.createElement('div');
                    cell.className = `calc-cell calc-cell-row2 calc-cell-col${i} calc-cell-answer editable`;
                    cell.contentEditable = 'true';
                    
                    const digitIndex = strAns.length - (5 - i);
                    if (digitIndex >= 0) {
                        cell.innerText = strAns[digitIndex];
                    } else {
                        cell.innerHTML = '&nbsp;';
                    }
                    calcGrid.appendChild(cell);
                }

                calcWrapper.appendChild(calcGrid);
                probItem.appendChild(calcWrapper);
                grid.appendChild(probItem);
            }

            toggleAnswerVisibility();
        }

        function saveHTML() {
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                if (input.type === 'checkbox') {
                    if (input.checked) {
                        input.setAttribute('checked', 'checked');
                    } else {
                        input.removeAttribute('checked');
                    }
                } else if (input.type === 'number') {
                    input.setAttribute('value', input.value);
                }
            });

            const printArea = document.getElementById('print-area');
            const fontSize = document.getElementById('font-size-pt').value;
            printArea.style.setProperty('--print-font-size', fontSize + 'pt');

            const htmlContent = document.documentElement.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = 'hissan_print_data.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showToast('現在の内容をHTMLファイルとして保存しました！');
        }

        function loadHTML(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const parser = new DOMParser();
                const doc = parser.parseFromString(e.target.result, 'text/html');

                const newSettings = doc.querySelector('.settings-panel');
                const newPrintArea = doc.querySelector('#print-area');

                if (newSettings && newPrintArea) {
                    document.querySelector('.settings-panel').innerHTML = newSettings.innerHTML;
                    document.querySelector('#print-area').innerHTML = newPrintArea.innerHTML;

                    syncLoadedInputs();
                    
                    showToast('保存されたプリントを読み込みました！引き続き編集ができます。');
                } else {
                    showToast('有効な「ひっ算プリント」のHTMLファイルではありません。');
                }
            };
            reader.readAsText(file);
        }

        window.onload = function() {
            generateProblems();
        };
    </script>
</body>
</html>
